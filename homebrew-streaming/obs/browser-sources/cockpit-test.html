<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cockpit Composite Test — Image + FX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: #000;
    overflow: hidden;
  }

  /* ════════════════ LAYER 1 — COCKPIT IMAGE BACKGROUND (two views) ════════════════
     Two divs, one per view. Opacity controlled by body.view-* class.
     contain = preserve aspect, letterbox if needed. */
  .cockpit-bg {
    position: absolute; inset: 0;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #000;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #bg-close { background-image: url('/cockpit-image-close'); }
  #bg-wide  { background-image: url('/cockpit-image-wide'); }
  body.view-close #bg-close { opacity: 1; }
  body.view-wide  #bg-wide  { opacity: 1; }

  /* ════════════════ LAYER 2 — FX OVERLAY ════════════════ */
  #fx { position: absolute; inset: 0; pointer-events: none; }

  /* Neon — top amber chevron, slow 30s breath */
  .neon-chevron {
    position: absolute; top: 6%; left: 8%; width: 84%; height: 18%;
    background: radial-gradient(ellipse 70% 80% at 50% 60%, rgba(255,140,0,0.55), transparent 70%);
    mix-blend-mode: screen; filter: blur(8px);
    animation: pulse-amber 5s ease-in-out infinite;
  }
  @keyframes pulse-amber {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 1.0; }
  }

  .neon-chevron-2 {
    position: absolute; top: 6%; left: 8%; width: 84%; height: 18%;
    background: radial-gradient(ellipse 60% 60% at 50% 60%, rgba(255,200,80,0.4), transparent 65%);
    mix-blend-mode: screen; filter: blur(4px);
    animation: pulse-amber-2 4s ease-in-out infinite;
  }
  @keyframes pulse-amber-2 {
    0%, 100% { opacity: 0.1; }
    50%      { opacity: 0.95; }
  }

  /* Side purple strips — 31s and 33s for natural drift */
  .neon-side-left {
    position: absolute; top: 8%; left: 0; width: 14%; height: 50%;
    background: linear-gradient(90deg, rgba(180,60,240,0.45), rgba(180,60,240,0.25) 60%, transparent);
    mix-blend-mode: screen; filter: blur(10px);
    animation: pulse-purple 5s ease-in-out infinite;
  }
  .neon-side-right {
    position: absolute; top: 8%; right: 0; width: 14%; height: 50%;
    background: linear-gradient(270deg, rgba(180,60,240,0.45), rgba(180,60,240,0.25) 60%, transparent);
    mix-blend-mode: screen; filter: blur(10px);
    animation: pulse-purple 6s ease-in-out infinite;
    animation-delay: 6s;
  }
  @keyframes pulse-purple {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 1.0; }
  }

  /* Bottom corner glows — 29s and 32s */
  .neon-bottom-left {
    position: absolute; bottom: 18%; left: 0; width: 18%; height: 22%;
    background: radial-gradient(ellipse 80% 60% at 30% 50%, rgba(160,40,220,0.4), transparent 70%);
    mix-blend-mode: screen; filter: blur(12px);
    animation: pulse-purple-slow 4s ease-in-out infinite;
  }
  .neon-bottom-right {
    position: absolute; bottom: 18%; right: 0; width: 18%; height: 22%;
    background: radial-gradient(ellipse 80% 60% at 70% 50%, rgba(160,40,220,0.4), transparent 70%);
    mix-blend-mode: screen; filter: blur(12px);
    animation: pulse-purple-slow 5s ease-in-out infinite;
    animation-delay: 11s;
  }
  @keyframes pulse-purple-slow {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 1.0; }
  }

  /* Smoke wisps — kept fast, user said smoke is good */
  .smoke {
    position: absolute; width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(220,210,200,0.55) 10%, rgba(180,170,160,0.25) 50%, transparent 80%);
    border-radius: 50%; filter: blur(20px); mix-blend-mode: screen;
  }
  .smoke-1 { top: 60%; left: 18%; animation: drift-up 9s ease-in-out infinite; }
  .smoke-2 { top: 64%; left: 38%; animation: drift-up 11s ease-in-out infinite; animation-delay: 3s; }
  .smoke-3 { top: 58%; right: 20%; animation: drift-up 13s ease-in-out infinite; animation-delay: 5s; }
  .smoke-4 { top: 62%; left: 60%; animation: drift-up 8s ease-in-out infinite; animation-delay: 1.5s; width: 280px; height: 280px; }
  @keyframes drift-up {
    0%   { transform: translate(0, 0) scale(0.7); opacity: 0; }
    20%  { opacity: 0.5; }
    50%  { transform: translate(-20px, -120px) scale(1.0); opacity: 0.6; }
    80%  { opacity: 0.3; }
    100% { transform: translate(-40px, -260px) scale(1.4); opacity: 0; }
  }


  /* ════════════════ TINY WISPS — animate INSIDE the baked-in static smoke clouds ════════════════
     Two cloud regions in image: left (~18%, 45%) and right (~75%, 45%).
     6 small wisps, 3 per region, all on different cycles — makes static clouds feel alive. */
  .wisp {
    position: absolute; width: 90px; height: 90px;
    background: radial-gradient(circle, rgba(245,240,230,0.85) 5%, rgba(220,210,200,0.4) 50%, transparent 80%);
    border-radius: 50%; filter: blur(10px); mix-blend-mode: screen;
    will-change: transform, opacity;
  }
  .wisp.left-1  { top: 24%; left: 10%; animation: wisp-drift 4.2s ease-in-out infinite; width: 130px; height: 130px; }
  .wisp.left-2  { top: 30%; left: 16%; animation: wisp-drift 5.8s ease-in-out infinite; animation-delay: 1.4s; width: 100px; height: 100px; }
  .wisp.left-3  { top: 33%; left: 8%;  animation: wisp-drift 3.6s ease-in-out infinite; animation-delay: 0.7s; width: 90px;  height: 90px; }
  .wisp.right-1 { top: 24%; right: 22%; animation: wisp-drift 4.7s ease-in-out infinite; animation-delay: 0.3s; width: 130px; height: 130px; }
  .wisp.right-2 { top: 30%; right: 28%; animation: wisp-drift 5.3s ease-in-out infinite; animation-delay: 2.1s; width: 100px; height: 100px; }
  .wisp.right-3 { top: 33%; right: 18%; animation: wisp-drift 3.9s ease-in-out infinite; animation-delay: 1.1s; width: 90px;  height: 90px; }

  @keyframes wisp-drift {
    0%, 100% { transform: translate(0, 0) scale(1.0); opacity: 0.65; }
    25%      { transform: translate(8px, -10px) scale(1.2); opacity: 0.95; }
    50%      { transform: translate(-5px, -18px) scale(0.95); opacity: 0.75; }
    75%      { transform: translate(12px, -6px) scale(1.15); opacity: 1.0; }
  }

  /* Falling sparks */
  .spark {
    position: absolute; top: -20px; width: 4px; height: 4px;
    background: #ffaa44; border-radius: 50%;
    box-shadow: 0 0 8px #ffaa44, 0 0 14px rgba(255,140,0,0.6);
  }
  .spark-1 { left: 25%; animation: spark-fall 2s linear infinite; }
  .spark-2 { left: 55%; animation: spark-fall 2.5s linear infinite; animation-delay: 2.1s; }
  .spark-3 { left: 78%; animation: spark-fall 1.8s linear infinite; animation-delay: 1.3s; }
  .spark-4 { left: 38%; animation: spark-fall 2.7s linear infinite; animation-delay: 4.5s; }
  .spark-5 { left: 68%; animation: spark-fall 2.3s linear infinite; animation-delay: 0.7s; }
  .spark-6 { left: 10%; animation: spark-fall 2.1s linear infinite; animation-delay: 0.3s; }
  .spark-7 { left: 45%; animation: spark-fall 1.9s linear infinite; animation-delay: 1.7s; }
  .spark-8 { left: 88%; animation: spark-fall 2.4s linear infinite; animation-delay: 2.5s; }
  .spark-9 { left: 30%; animation: spark-fall 2.6s linear infinite; animation-delay: 0.9s; }
  .spark-10 { left: 60%; animation: spark-fall 2.0s linear infinite; animation-delay: 3.1s; }
  @keyframes spark-fall {
    0%   { transform: translateY(0); opacity: 0; }
    5%   { opacity: 1; }
    100% { transform: translateY(420px) translateX(-30px); opacity: 0; }
  }

  /* Ambient breathe — slow 30s */
  .ambient {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 60%, rgba(255,140,0,0.05));
    mix-blend-mode: screen;
    animation: ambient-shift 30s ease-in-out infinite;
  }
  @keyframes ambient-shift {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1.0; }
  }

  /* Test annotation */
  #annotate {
    position: absolute; top: 20px; left: 20px;
    background: rgba(0,0,0,0.85);
    color: #00ff88; font-family: "SF Mono", monospace; font-size: 11px;
    padding: 8px 12px; border-left: 3px solid #00ff88;
    z-index: 99;
  }
  #annotate .v { color: #facc15; }
</style>
</head>
<body class="view-close">
<div id="bg-close" class="cockpit-bg"></div>
<div id="bg-wide"  class="cockpit-bg"></div>

<div id="fx">
  <div class="neon-chevron"></div>
  <div class="neon-chevron-2"></div>
  <div class="neon-side-left"></div>
  <div class="neon-side-right"></div>
  <div class="neon-bottom-left"></div>
  <div class="neon-bottom-right"></div>
  <div class="smoke smoke-1"></div>
  <div class="smoke smoke-2"></div>
  <div class="smoke smoke-3"></div>
  <div class="smoke smoke-4"></div>
  
  <div class="wisp left-1"></div>
  <div class="wisp left-2"></div>
  <div class="wisp left-3"></div>
  <div class="wisp right-1"></div>
  <div class="wisp right-2"></div>
  <div class="wisp right-3"></div>
  <div class="spark spark-1"></div>
  <div class="spark spark-2"></div>
  <div class="spark spark-3"></div>
  <div class="spark spark-4"></div>
  <div class="spark spark-5"></div>
  <div class="spark spark-6"></div>
  <div class="spark spark-7"></div>
  <div class="spark spark-8"></div>
  <div class="spark spark-9"></div>
  <div class="spark spark-10"></div>
  <div class="ambient"></div>
</div>

<div id="annotate">TEST COMPOSITE — view: <span class="v" id="view-v">close</span> · 30s pulse · Caps+1/2 to swap</div>

<script>
// Poll cockpit-state.json every 1 sec — Hammerspoon writes view changes there.
let lastView = '';
async function pollView() {
  try {
    const r = await fetch('/cockpit-state.json?t=' + Date.now());
    const d = await r.json();
    const v = d.view || 'close';
    if (v !== lastView) {
      document.body.classList.remove('view-close', 'view-wide');
      document.body.classList.add('view-' + v);
      document.getElementById('view-v').textContent = v;
      lastView = v;
    }
  } catch(e) {}
}
pollView();
setInterval(pollView, 1000);
</script>
</body>
</html>
